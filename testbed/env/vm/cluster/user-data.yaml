# No `users:` block, as it would replace the image's default `debian` user. cloud-init gives
# that user the key and passwordless sudo, which vm.sh relies on, e.g. for the kubeconfig.
ssh_authorized_keys:
  - ${SSH_PUBKEY}

write_files:
  # plain-HTTP mirror: slirp routes 10.0.2.2 to the devcontainer's loopback; manifests keep
  # localhost:5000/<name>, whichever builder pushed it
  - path: /etc/rancher/k3s/registries.yaml
    permissions: "0644"
    content: |
      mirrors:
        "localhost:5000":
          endpoint:
            - "http://10.0.2.2:5000"

# Airgapped install from the files seed.sh put on the seed ISO, at the versions pinned in
# versions.just, so a reset VM needs no downloads. The images tarball is picked up from k3s's
# images dir on start. No INSTALL_K3S_EXEC, so the bundled traefik and metrics-server stay,
# for the ingress. The kubeconfig holds admin credentials, hence 0600.
runcmd:
  - |
    set -euo pipefail
    mkdir -p /mnt/seed
    mountpoint -q /mnt/seed || mount -o ro LABEL=cidata /mnt/seed
    install -m 0755 /mnt/seed/k3s /usr/local/bin/k3s
    install -D -m 0644 /mnt/seed/k3s-airgap-images-amd64.tar.zst \
      /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst
    INSTALL_K3S_SKIP_DOWNLOAD=true K3S_KUBECONFIG_MODE=0600 sh /mnt/seed/install.sh
    umount /mnt/seed
